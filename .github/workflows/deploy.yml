name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "🚀 Syncing latest changes from git..."
            cd /var/www/earnx
            git reset --hard HEAD
            git clean -fd -e .env -e .env.* -e backend/.env -e frontend/.env.local -e backend/uploads -e uploads
            rm -f frontend/public/5133fba3230587ae6186.txt
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Updating Backend..."
            cd /var/www/earnx/backend
            npm install
            npx prisma generate
            npx prisma db push --accept-data-loss
            node prisma/seed-live-packages.js
            npm run build
            pm2 restart earnx-backend

            echo "🌐 Updating Frontend..."
            cd /var/www/earnx/frontend
            npm install
            npm run build
            pm2 restart earnx-frontend

            echo "✅ Deployment Successful!"
